<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandan — Everything you need. One destination.</title>
<meta name="description" content="Explore Sandan Industrial City: find businesses, see them on the city plan, get directions and request commercial space.">
<meta name="theme-color" content="#F0F1EE">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F4C5C'/><path d='M8 22 16 9l8 13z' fill='%23F5B301'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SANDAN — visual system v2
   Wayfinding-sign language: condensed display type, site-plan drawing,
   road-marking signal yellow for the few things that matter.
   ===================================================================== */
:root {
  --gypsum: #F0F1EE; --paper: #FFFFFF; --surface-2: #E6E8E4;
  --asphalt: #22272C; --ink-2: #4E5760; --ink-3: #6F7880; --line: #D5D9D3;
  --petrol: #0F4C5C; --petrol-2: #0A3843; --on-petrol: #EEF3F2;
  --signal: #F5B301; --dune: #DDCCAA; --dune-2: #E8DDC6; --road: #3B4148;
  --block: #FBFAF7; --block-edge: #B9B3A6;
  --c-automotive: #2F5BD9; --c-industrial: #B8521F; --c-commercial: #0E8466; --c-services: #6D4BC4;
  --c-living: #8A8F94; --c-expansion: #A89A7C; --c-space: #F5B301;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Readex Pro", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-kufi: "Reem Kufi", "Readex Pro", Tahoma, sans-serif;
  --gut: clamp(1rem, 4vw, 3rem); --max: 1320px;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --bar-h: 64px;
  --shadow: 0 18px 44px -18px rgba(20, 30, 40, .45);
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gypsum: #1A1F23; --paper: #22282D; --surface-2: #151A1D; --asphalt: #ECEEEA; --ink-2: #B4BCC2; --ink-3: #8E979E;
    --line: #353D43; --petrol: #3C8C9E; --petrol-2: #0E3440; --dune: #5A5140; --dune-2: #3E392F;
    --road: #15181B; --block: #2C3237; --block-edge: #4A5258;
    --c-automotive: #6D8FF0; --c-industrial: #E0834F; --c-commercial: #34B892; --c-services: #9E82E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --gypsum: #1A1F23; --paper: #22282D; --surface-2: #151A1D; --asphalt: #ECEEEA; --ink-2: #B4BCC2; --ink-3: #8E979E;
  --line: #353D43; --petrol: #3C8C9E; --petrol-2: #0E3440; --dune: #5A5140; --dune-2: #3E392F;
  --road: #15181B; --block: #2C3237; --block-edge: #4A5258;
  --c-automotive: #6D8FF0; --c-industrial: #E0834F; --c-commercial: #34B892; --c-services: #9E82E6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--gypsum); color: var(--asphalt); font: 400 1rem/1.6 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img, svg { max-width: 100%; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.i { width: 1.25em; height: 1.25em; flex: none; }
.wrap { width: min(100% - 2 * var(--gut), var(--max)); margin-inline: auto; }

h2 { font: 800 clamp(2.4rem, 5.2vw, 4.4rem)/.95 var(--f-display); letter-spacing: -.005em; text-wrap: balance; }
h3 { font: 600 1.2rem/1.3 var(--f-body); }
.lede { font-size: clamp(1.05rem, 1.4vw, 1.2rem); color: var(--ink-2); max-width: 56ch; margin-top: 1rem; }
:lang(ar) h2, :lang(ar) .hero h1 { font-family: var(--f-kufi); font-weight: 700; line-height: 1.25; letter-spacing: 0; }
:lang(ar) body { line-height: 1.75; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: 0 1.25rem; border-radius: 999px; border: 1.5px solid transparent; font-weight: 500; text-decoration: none; white-space: nowrap; transition: background-color .2s, color .2s, border-color .2s, transform .15s var(--ease); }
.btn:active { transform: scale(.97); }
.btn-sm { min-height: 40px; padding: 0 1rem; font-size: .92rem; }
.btn-lg { min-height: 54px; padding: 0 1.6rem; font-size: 1.05rem; }
.btn-petrol { background: var(--petrol); color: var(--on-petrol); }
.btn-petrol:hover { background: var(--petrol-2); }
.btn-signal { background: var(--signal); color: #1D1F21; }
.btn-signal:hover { background: #E3A500; }
.btn-ghost { border-color: var(--line); background: var(--paper); }
.btn-ghost:hover { border-color: var(--asphalt); }
.textlink { font-weight: 500; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.skip { position: fixed; top: -100px; inset-inline-start: 1rem; z-index: 100; background: var(--signal); color: #1D1F21; padding: .6rem 1rem; border-radius: var(--r-s); }
.skip:focus { top: 1rem; }

/* Bar */
.bar { position: fixed; top: 0; inset-inline: 0; z-index: 40; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; gap: 1.5rem; padding-inline: var(--gut); background: color-mix(in srgb, var(--gypsum) 94%, transparent); border-bottom: 1px solid transparent; transition: border-color .3s; }
.bar.is-scrolled { border-bottom-color: var(--line); }
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; font: 800 1.5rem/1 var(--f-display); letter-spacing: .01em; }
.brand svg { width: 30px; height: 30px; }
.brand-ar { font-family: var(--f-kufi); font-size: 1.15rem; font-weight: 600; color: var(--ink-2); }
.nav { display: flex; gap: .25rem; }
.nav a { text-decoration: none; padding: .5rem .8rem; color: var(--ink-2); font-size: .95rem; transition: color .2s, box-shadow .2s; }
.nav a:hover { color: var(--asphalt); }
.nav a.is-here { color: var(--asphalt); box-shadow: inset 0 -2px 0 var(--signal); }
.bar-end { margin-inline-start: auto; display: flex; align-items: center; gap: .75rem; }
.lang { border: 0; background: none; padding: .5rem .6rem; font-size: .95rem; border-radius: var(--r-s); }
.lang:hover { background: var(--surface-2); }
.lang:lang(ar) { font-family: var(--f-kufi); }

/* HERO */
.hero { position: relative; min-height: max(660px, min(100svh, 1000px)); padding: calc(var(--bar-h) + 2rem) var(--gut) clamp(2rem, 5vh, 4rem); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: end; overflow: hidden; overflow: clip visible; isolation: isolate; }
.hero-word { position: absolute; z-index: -2; top: calc(var(--bar-h) + 1vh); inset-inline-start: calc(var(--gut) - .06em); font: 900 clamp(7rem, 23vw, 25rem)/.78 var(--f-display); letter-spacing: -.012em; color: var(--petrol); user-select: none; white-space: nowrap; }
:lang(ar) .hero-word { font: 700 clamp(6rem, 19vw, 20rem)/1.05 var(--f-kufi); top: calc(var(--bar-h) - 3vh); }
.hero-model { position: absolute; z-index: -1; inset-inline-end: -5vw; bottom: -4vh; width: min(80vw, 1300px); aspect-ratio: 1.6;
  -webkit-mask-image: linear-gradient(to bottom, transparent 2%, #000 26%, #000 84%, transparent 99%);
  mask-image: linear-gradient(to bottom, transparent 2%, #000 26%, #000 84%, transparent 99%); }
.hero-model > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hero-cam { transform-origin: 55% 60%; animation: cam 2.8s var(--ease) both; }
@keyframes cam { from { transform: scale(1.14) translate(-2%, 5%); opacity: .0; } 18% { opacity: 1; } to { transform: none; } }
.hero-copy { grid-column: 1 / span 5; padding-block-start: 30vh; }
.hero-sub { font-weight: 500; color: var(--ink-2); margin-bottom: .75rem; }
.hero h1 { font: 800 clamp(2.2rem, 4vw, 3.7rem)/.98 var(--f-display); text-wrap: balance; max-width: 13ch; }
:lang(ar) .hero h1 { font-size: clamp(1.8rem, 3vw, 2.8rem); max-width: 16ch; }
.hero-lede { margin-top: 1rem; color: var(--ink-2); max-width: 42ch; }
.ask { display: block; margin-top: 1.75rem; font-weight: 600; font-size: 1.05rem; }
.hero-search { position: relative; margin-top: .6rem; display: flex; align-items: center; gap: .5rem; background: var(--paper); border: 1.5px solid var(--asphalt); border-radius: 999px; padding: .35rem .35rem .35rem 1.1rem; box-shadow: 0 10px 30px -18px rgba(15,40,50,.5); max-width: 540px; }
[dir="rtl"] .hero-search { padding: .35rem 1.1rem .35rem .35rem; }
.hero-search:focus-within { outline: 3px solid var(--signal); outline-offset: 2px; }
.hero-search input { flex: 1; min-width: 0; border: 0; background: none; font-size: 1.05rem; padding: .6rem 0; outline: none; }
.hero-search input::-webkit-search-cancel-button { display: none; }
.hero-search > .i { color: var(--ink-3); }
.hero-cta { margin-top: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem; }

/* suggestions */
.sgx { position: relative; }
.sg { position: absolute; z-index: 30; top: calc(100% + 8px); inset-inline: 0; background: var(--paper); border-radius: var(--r-m); box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: .5rem; max-height: 360px; overflow-y: auto; animation: popIn .2s var(--ease); }
.sg h4 { font-size: .78rem; font-weight: 500; color: var(--ink-3); padding: .4rem .6rem .2rem; }
.sg-chips { display: flex; flex-wrap: wrap; gap: .35rem; padding: .3rem .5rem .6rem; }
.sg-chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: .3rem .8rem; font-size: .9rem; }
.sg-chip:hover, .sg-chip.is-act { border-color: var(--asphalt); background: var(--gypsum); }
.sg-row { display: flex; width: 100%; align-items: center; gap: .6rem; border: 0; background: none; text-align: start; padding: .55rem .6rem; border-radius: var(--r-s); font-size: .95rem; }
.sg-row:hover, .sg-row.is-act { background: var(--gypsum); }
.sg-row small { margin-inline-start: auto; color: var(--ink-3); font-size: .8rem; }
.sg-row .i { color: var(--c, var(--ink-3)); }

/* Iso shared */
.iso-ground { fill: var(--dune); }
.iso-road { fill: var(--road); }
.iso-mark { stroke: var(--signal); stroke-width: 2; stroke-dasharray: 10 12; fill: none; opacity: .9; }
.iso-top { fill: var(--block); }
.iso-l { fill: color-mix(in srgb, var(--block) 72%, #7a7466); }
.iso-r { fill: color-mix(in srgb, var(--block) 86%, #7a7466); }
.iso-edge { stroke: color-mix(in srgb, var(--block-edge) 60%, transparent); stroke-width: .8; stroke-linejoin: round; }
.iso-plot { fill: none; stroke: var(--block-edge); stroke-width: 1.2; stroke-dasharray: 5 5; }
.iso-beacon { opacity: 0; transition: opacity .6s var(--ease); }
.iso-beacon.is-on { opacity: 1; }
.iso-beacon line { stroke-width: 1.5; }
.iso-beacon circle { stroke: var(--paper); stroke-width: 2; }
.iso-car { fill: var(--signal); }
.iso-car.w { fill: #fff; }

/* UNDERSTAND */
.here { padding-block: clamp(4rem, 10vw, 8rem) clamp(3rem, 6vw, 5rem); }
.here-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 2rem; align-items: end; }
.here-head .lede { margin-top: 0; }
.here-grid { margin-top: clamp(2rem, 5vw, 4rem); display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: start; }
.here-plan { background: var(--dune-2); border-radius: var(--r-l); padding: clamp(.75rem, 2vw, 1.5rem); }
.here-plan svg { display: block; width: 100%; height: auto; }
.districts { display: grid; gap: .25rem; }
.district { display: grid; grid-template-columns: 4px 1fr auto; gap: 1rem; align-items: start; padding: 1.1rem 1rem; border-radius: var(--r-m); cursor: pointer; transition: background-color .2s; }
.district:hover, .district:focus-within { background: var(--paper); }
.district-bar { align-self: stretch; border-radius: 2px; background: var(--c); }
.district h3 { display: flex; align-items: center; gap: .5rem; }
.district h3 .i { color: var(--c); }
.district p { color: var(--ink-2); font-size: .95rem; margin-top: .25rem; max-width: 46ch; }
.district-n { font-size: .82rem; color: var(--ink-3); margin-top: .4rem; display: block; }
.district button { border: 0; background: none; color: var(--petrol); font-weight: 500; font-size: .9rem; padding: .4rem 0; white-space: nowrap; }
.district button:hover { text-decoration: underline; text-underline-offset: 3px; }
.facts { margin-top: clamp(3rem, 6vw, 5rem); }
.facts-title { font-size: 1rem; color: var(--ink-2); font-weight: 500; }
.facts-list { margin-top: 1rem; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); border-top: 2px solid var(--asphalt); }
.fact { padding: 1.4rem 1rem 1rem; border-inline-end: 1px solid var(--line); }
.fact:first-child { padding-inline-start: 0; }
.fact:last-child { border-inline-end: 0; }
.fact dt { font: 800 clamp(2.2rem, 4vw, 3.4rem)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.fact dd { margin-top: .4rem; color: var(--ink-2); }
.fact.is-ph dt { color: var(--ink-3); }

/* EXPLORE */
.explore { background: var(--surface-2); padding-top: clamp(3.5rem, 8vw, 6rem); }
.ex-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: .5rem 2rem; margin-bottom: 1.75rem; }
.ex-head .lede { margin-top: 0; max-width: 44ch; }
.stage { position: relative; height: clamp(640px, calc(100svh - var(--bar-h)), 1000px); overflow: hidden; background: var(--dune-2); isolation: isolate; }
.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.map.is-drag { cursor: grabbing; }
.map.is-placing { cursor: crosshair; }
.map:focus-visible { outline-offset: -4px; }

.tilt { transition: transform .95s cubic-bezier(.65, 0, .25, 1); }
.map.is-iso .tilt { transform: matrix(0.866, 0.5, -0.866, 0.5, 0, 0); }
.p-out { fill: var(--dune-2); }
.p-site { fill: var(--dune); }
.p-road { fill: var(--road); }
.p-mark { stroke: var(--signal); stroke-width: 1.4; stroke-dasharray: 8 10; fill: none; }
.p-block { fill: var(--block); stroke: var(--block-edge); stroke-width: 1; transition: fill .3s, opacity .3s; cursor: pointer; }
.p-tint { fill: var(--c); opacity: .14; pointer-events: none; transition: opacity .3s; }
.p-unit { stroke: var(--block-edge); stroke-width: .6; opacity: .7; pointer-events: none; }
.p-exp { fill: url(#hatch); stroke: var(--block-edge); stroke-dasharray: 4 4; }
.p-lbl { font: 600 9px var(--f-body); fill: var(--ink-3); pointer-events: none; text-anchor: middle; }
.p-zlbl { font: 600 13px var(--f-body); fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--dune); stroke-width: 4px; text-anchor: middle; }
.p-road-lbl { font: 500 10px var(--f-body); fill: #d9dcde; pointer-events: none; paint-order: stroke; stroke: var(--road); stroke-width: 5px; }
.p-amen circle { fill: var(--paper); stroke: var(--asphalt); stroke-width: 1.2; }
.p-amen path { fill: var(--asphalt); }
.p-amen-in { transform: scale(var(--k, 1)); transform-box: fill-box; transform-origin: center; }
.p-amen-lbl { font: 500 10px var(--f-body); fill: var(--asphalt); paint-order: stroke; stroke: var(--dune); stroke-width: 3px; text-anchor: middle; }
.plan-static .p-zlbl, .why-site .p-zlbl, .match-plan .p-zlbl { font-size: 24px; }
.plan-static .p-amen-lbl, .why-site .p-amen-lbl, .match-plan .p-amen-lbl { display: none; }
.plan-static .p-amen-in, .why-site .p-amen-in { transform: scale(1.6); }
.plan-static[data-focus] .p-block:not(.is-focus) { opacity: .55; }
.plan-static .p-tint.is-focus { opacity: .38; }

/* map layers */
.m-lbls text { transition: opacity .3s; }
.map .m-blk-lbl { opacity: 0; }
.map.is-close .m-blk-lbl { opacity: 1; }
.map.is-iso .m-zone-lbl, .map.is-close .m-zone-lbl { opacity: 0; }
.m-lbl-g { transition: transform .95s cubic-bezier(.65, 0, .25, 1); }
.m-lbl-g > text { transform: scale(var(--k, 1)); transform-box: fill-box; transform-origin: center; }
.map .p-lbl { font-size: 11px; }
.map .p-road-lbl { font-size: 11px; }
.map[data-filter] .p-block:not(.is-on) { opacity: .5; }
.map[data-filter] .p-block.is-on + .p-tint { opacity: .34; }
.p-block.is-sel { stroke: var(--signal); stroke-width: 3; }

.m-build { transition: opacity .5s; }
.map:not(.is-iso) .m-build { opacity: 0; pointer-events: none; transition-duration: .25s; }
.pr { cursor: pointer; transition: opacity .35s; }
.pr polygon { transition: fill .35s; }
.pr .roof { fill: color-mix(in srgb, var(--block) 78%, var(--c)); }
.pr.is-hover .roof, .pr.is-on .roof { fill: color-mix(in srgb, var(--block) 45%, var(--c)); }
.map[data-filter] .pr:not(.is-on) { opacity: .38; }
.pr.is-sel .roof { fill: var(--c); }
.pr.is-sel .iso-l { fill: color-mix(in srgb, var(--c) 55%, #444); }
.pr.is-sel .iso-r { fill: color-mix(in srgb, var(--c) 72%, #555); }
.pr.is-sel polygon { stroke: var(--signal); stroke-width: 1.6; }
.pr-glow { fill: none; stroke: var(--signal); stroke-width: 3; opacity: 0; }
.pr.is-sel .pr-glow { opacity: 1; animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .35; } to { opacity: 1; } }

.mk { cursor: pointer; transition: transform .95s cubic-bezier(.65, 0, .25, 1), opacity .3s; }
.map.is-panning .mk, .map.is-panning .m-lbl-g { transition: opacity .3s; }
.mk-in { transform: scale(var(--k, 1)); transform-box: fill-box; transform-origin: 50% 100%; transition: transform .25s var(--ease); }
.mk-pin { fill: var(--c); stroke: var(--paper); stroke-width: 2; }
.mk-core { fill: var(--paper); }
.mk.is-dim { opacity: .14; pointer-events: none; }
.mk.is-hot .mk-in, .mk:hover .mk-in, .mk:focus-visible .mk-in { transform: scale(calc(var(--k, 1) * 1.3)); }
.mk.is-sel .mk-in { transform: scale(calc(var(--k, 1) * 1.45)); }
.mk.is-sel .mk-pin { stroke: var(--signal); stroke-width: 3; }
.mk:focus { outline: none; }
.mk-halo { fill: var(--c); opacity: 0; transform-box: fill-box; transform-origin: center; }
.mk.is-sel .mk-halo { animation: halo 1.8s ease-out infinite; }
@keyframes halo { 0% { opacity: .45; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.4); } }
.sk-pin { fill: var(--signal); stroke: var(--asphalt); stroke-width: 2; }
.sk-core { fill: var(--asphalt); }
.map:not([data-spaces]) .sk { opacity: 0; pointer-events: none; }
.map[data-spaces] .mk { opacity: .12; pointer-events: none; }
.m-route path { fill: none; stroke: var(--signal); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.m-route path.casing { stroke: var(--asphalt); stroke-width: 11; opacity: .85; }
.m-route .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: drawIn 1.4s var(--ease) forwards; }
@keyframes drawIn { to { stroke-dashoffset: 0; } }
.m-radius { fill: color-mix(in srgb, var(--petrol) 14%, transparent); stroke: var(--petrol); stroke-width: 2; stroke-dasharray: 6 5; transition: r .4s var(--ease); }
.you-dot { fill: #1F7AE0; stroke: #fff; stroke-width: 3; }
.you-pulse { fill: #1F7AE0; opacity: .25; transform-box: fill-box; transform-origin: center; animation: halo 2s ease-out infinite; }
.stop-n circle { fill: var(--asphalt); stroke: var(--signal); stroke-width: 2.5; }
.stop-n text { fill: #fff; font: 700 13px var(--f-body); text-anchor: middle; }
.stop-n .in { transform: scale(var(--k, 1)); transform-box: fill-box; transform-origin: center; }

/* map chrome */
.mctl { position: absolute; z-index: 6; top: 1rem; inset-inline-end: 1rem; display: grid; gap: .6rem; justify-items: end; }
.mode { display: flex; background: var(--paper); border-radius: 999px; padding: 4px; box-shadow: 0 6px 20px -12px rgba(0,0,0,.4); }
.mode button { border: 0; background: none; border-radius: 999px; padding: .45rem .95rem; font-weight: 600; font-size: .9rem; min-height: 38px; }
.mode button[aria-pressed="true"] { background: var(--asphalt); color: var(--gypsum); }
.zoom { display: grid; gap: 1px; background: var(--line); border-radius: var(--r-s); overflow: hidden; box-shadow: 0 6px 20px -12px rgba(0,0,0,.4); }
.zoom button { width: 42px; height: 42px; border: 0; background: var(--paper); display: grid; place-items: center; }
.zoom button:hover { background: var(--gypsum); }
.legend { position: absolute; z-index: 4; bottom: 1rem; inset-inline-end: 1rem; background: color-mix(in srgb, var(--paper) 92%, transparent); border-radius: var(--r-m); padding: .6rem .8rem; font-size: .78rem; display: grid; gap: .25rem; }
.legend b { font-weight: 500; color: var(--ink-3); }
.legend span { display: flex; align-items: center; gap: .45rem; }
.hint { position: absolute; z-index: 7; top: 1rem; left: 50%; transform: translateX(-50%); background: var(--asphalt); color: var(--gypsum); padding: .5rem 1rem; border-radius: 999px; font-size: .85rem; pointer-events: none; animation: popIn .2s var(--ease); white-space: nowrap; }
.tip { position: absolute; z-index: 7; pointer-events: none; background: var(--asphalt); color: var(--gypsum); padding: .4rem .7rem; border-radius: var(--r-s); font-size: .82rem; line-height: 1.35; transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap; }
.tip b { font-weight: 600; }

/* floating panel / bottom sheet */
.panel { position: absolute; z-index: 5; top: 1rem; bottom: 1rem; inset-inline-start: 1rem; width: 404px; background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.grab { display: none; }
.panel-head { padding: 1rem 1rem .5rem; display: grid; gap: .65rem; border-bottom: 1px solid var(--line); }
.ex-search { display: flex; align-items: center; gap: .6rem; background: var(--gypsum); border-radius: var(--r-m); padding-inline: 1rem; min-height: 54px; border: 1.5px solid transparent; }
.ex-search:focus-within { border-color: var(--asphalt); background: var(--paper); }
.ex-search > .i { color: var(--ink-3); }
.ex-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 1.08rem; padding-block: .7rem; }
.ex-search input::-webkit-search-cancel-button { display: none; }
.ex-clear { border: 0; background: var(--surface-2); border-radius: 999px; width: 32px; height: 32px; display: grid; place-items: center; }
.cats { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; margin-inline: -1rem; padding-inline: 1rem; }
.cats::-webkit-scrollbar { display: none; }
.cat { display: inline-flex; align-items: center; gap: .45rem; flex: none; min-height: 40px; padding: 0 .9rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 500; font-size: .92rem; transition: background-color .2s, color .2s, border-color .2s; }
.cat .i { color: var(--c, var(--ink-2)); width: 1.1em; height: 1.1em; }
.cat-n { font-size: .78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cat:hover { border-color: var(--asphalt); }
.cat[aria-selected="true"] { background: var(--asphalt); color: var(--gypsum); border-color: var(--asphalt); }
.cat[aria-selected="true"] .i { color: var(--c, var(--signal)); }
.cat[aria-selected="true"] .cat-n { color: color-mix(in srgb, var(--gypsum) 70%, transparent); }
.cat.is-space { border-style: dashed; }
.subs { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; margin-inline: -1rem; padding-inline: 1rem; }
.subs::-webkit-scrollbar { display: none; }
.subs:empty { display: none; }
.sub { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .25rem .75rem; font-size: .84rem; color: var(--ink-2); }
.sub:hover { color: var(--asphalt); border-color: var(--asphalt); }
.sub[aria-pressed="true"] { background: var(--paper); color: var(--asphalt); border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.subs.is-entering .sub { animation: chipIn .35s var(--ease) both; animation-delay: calc(var(--i) * 25ms); }
@keyframes chipIn { from { opacity: 0; transform: translateY(6px); } }
.tabs { display: flex; gap: .25rem; margin-top: .15rem; }
.tabs button { flex: 1; border: 0; background: none; padding: .55rem .25rem; font-size: .88rem; font-weight: 500; color: var(--ink-3); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--asphalt); border-bottom-color: var(--asphalt); }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.ws-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; padding: .85rem 1rem .5rem; }
.ws-meta strong { font: 800 1.3rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
:lang(ar) .ws-meta strong { font-family: var(--f-body); font-size: 1.02rem; font-weight: 600; }
.ws-meta span { font-size: .84rem; color: var(--ink-2); }
.interp b { color: var(--asphalt); font-weight: 600; }
.results { padding: 0 .5rem .75rem; }
.res { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: .85rem; align-items: start; padding: .7rem; border-radius: var(--r-m); cursor: pointer; transition: background-color .15s; }
.res:hover, .res.is-hot { background: var(--gypsum); }
.res.is-sel { background: var(--gypsum); box-shadow: inset 3px 0 0 var(--c); }
[dir="rtl"] .res.is-sel { box-shadow: inset -3px 0 0 var(--c); }
.res-thumb { width: 68px; height: 68px; border-radius: 10px; overflow: hidden; background: var(--dune-2); }
.res-thumb svg { width: 100%; height: 100%; display: block; }
.res h3 { font-size: .98rem; line-height: 1.3; font-weight: 600; }
.res h3 button { all: unset; cursor: pointer; }
.res h3 button:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 4px; }
.res-cat { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: .8rem; color: var(--ink-2); margin-top: .15rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.res-meta { display: flex; flex-wrap: wrap; gap: .15rem .9rem; margin-top: .3rem; font-size: .78rem; color: var(--ink-3); }
.open { color: var(--c-commercial); font-weight: 500; }
.shut { color: var(--ink-3); }
.badge { display: inline-block; font-size: .68rem; font-weight: 500; padding: .02rem .4rem; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-3); }
.res-dist { font-weight: 600; color: var(--asphalt); }
.results.is-swapping .res { animation: resIn .35s var(--ease) both; animation-delay: calc(min(var(--i), 10) * 22ms); }
@keyframes resIn { from { opacity: 0; transform: translateY(8px); } }
mark { background: color-mix(in srgb, var(--signal) 45%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty { padding: 1.5rem 1rem; }
.empty h3 { font-size: 1.05rem; }
.empty p { color: var(--ink-2); margin-top: .4rem; font-size: .93rem; }
.empty .btn { margin-top: 1rem; }
.empty-cats { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.pane-pad { padding: 1rem; display: grid; gap: .9rem; align-content: start; }
.pane-pad h3 { font: 800 1.6rem/1 var(--f-display); }
:lang(ar) .pane-pad h3 { font: 700 1.25rem/1.4 var(--f-kufi); }
.pane-pad > p { color: var(--ink-2); font-size: .93rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; }
.chipbtn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: .4rem .9rem; font-size: .9rem; font-weight: 500; }
.chipbtn[aria-pressed="true"] { background: var(--asphalt); color: var(--gypsum); border-color: var(--asphalt); }
.chipbtn:hover { border-color: var(--asphalt); }
.note { font-size: .86rem; color: var(--ink-2); background: var(--gypsum); padding: .6rem .8rem; border-radius: var(--r-s); }
.itin { display: grid; gap: 0; }
.itin li { display: grid; grid-template-columns: 34px 1fr; gap: .75rem; position: relative; padding-bottom: 1rem; }
.itin li::before { content: ""; position: absolute; top: 30px; bottom: 0; inset-inline-start: 16px; border-inline-start: 2px dashed var(--block-edge); }
.itin li:last-child::before { display: none; }
.itin-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--asphalt); color: #fff; font-weight: 700; font-size: .9rem; box-shadow: inset 0 0 0 2.5px var(--signal); }
.itin-n.is-gate { background: var(--paper); color: var(--asphalt); box-shadow: inset 0 0 0 2px var(--asphalt); }
.itin b { display: block; font-weight: 600; }
.itin small { color: var(--ink-3); font-size: .82rem; }
.itin button.linkish { all: unset; cursor: pointer; font-weight: 600; }
.itin button.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
.itin .miss b { color: var(--ink-3); font-weight: 500; }

/* popover */
.pop { position: absolute; z-index: 8; width: 330px; background: var(--paper); border-radius: var(--r-m); box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 1rem; animation: popIn .25s var(--ease); }
@keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.97); } }
.pop h3 { font-size: 1.1rem; padding-inline-end: 1.75rem; }
.pop .res-cat { margin-top: .25rem; font-size: .84rem; }
.pop-loc { margin-top: .6rem; font-size: .9rem; display: flex; align-items: center; gap: .4rem; font-weight: 500; }
.pop-svc { margin-top: .5rem; display: flex; flex-wrap: wrap; gap: .3rem; }
.pop-svc li { font-size: .78rem; background: var(--gypsum); border-radius: 999px; padding: .15rem .6rem; }
.pop-act { display: grid; grid-template-columns: 1fr auto auto; gap: .4rem; margin-top: .9rem; }
.pop-act .btn { min-height: 40px; font-size: .88rem; padding: 0 .8rem; }
.pop-act .icb { width: 40px; padding: 0; }
.pop-x { position: absolute; top: .6rem; inset-inline-end: .6rem; width: 30px; height: 30px; border: 0; border-radius: 999px; background: var(--gypsum); display: grid; place-items: center; }
.pop-x .i { width: 16px; height: 16px; }
.pop-biz { display: grid; gap: .15rem; margin-top: .6rem; max-height: 180px; overflow-y: auto; }
.pop-biz button { all: unset; cursor: pointer; display: flex; align-items: center; gap: .55rem; padding: .45rem .5rem; border-radius: var(--r-s); font-size: .92rem; }
.pop-biz button:hover, .pop-biz button:focus-visible { background: var(--gypsum); }
.pop-biz small { margin-inline-start: auto; color: var(--ink-3); }
.pop-space { margin-top: .75rem; padding-top: .75rem; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; font-size: .88rem; }
.pop-space .btn { min-height: 38px; font-size: .85rem; }
.pop-none { margin-top: .5rem; color: var(--ink-3); font-size: .9rem; }

/* PROFILE */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(15, 22, 28, .28); opacity: 0; transition: opacity .3s; }
.scrim.is-on { opacity: 1; }
.profile { position: fixed; z-index: 51; top: 0; bottom: 0; inset-inline-end: 0; width: min(520px, 100%); background: var(--paper); overflow-y: auto; overscroll-behavior: contain; transform: translateX(104%); transition: transform .45s var(--ease); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -20px 0 60px -30px rgba(0,0,0,.5); }
[dir="rtl"] .profile { transform: translateX(-104%); }
.profile.is-on { transform: none !important; }
.pf-hero { position: relative; aspect-ratio: 16 / 8.5; background: var(--dune-2); }
.pf-hero svg { width: 100%; height: 100%; display: block; }
.pf-photo { position: absolute; bottom: .75rem; inset-inline-start: .75rem; font-size: .75rem; background: rgba(255,255,255,.92); color: #333; padding: .2rem .6rem; border-radius: 999px; }
.pf-close { position: absolute; top: calc(.75rem + env(safe-area-inset-top, 0px)); inset-inline-end: .75rem; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--paper); display: grid; place-items: center; box-shadow: 0 4px 14px -6px rgba(0,0,0,.4); }
.pf-body { padding: 1.5rem clamp(1.25rem, 4vw, 2rem) 2.5rem; }
.pf-body > * + * { margin-top: 1.6rem; }
.pf-name { font: 800 clamp(2.1rem, 5vw, 2.8rem)/1 var(--f-display); }
:lang(ar) .pf-name { font: 700 1.9rem/1.3 var(--f-kufi); }
.pf-alt { margin-top: .35rem; color: var(--ink-3); font-size: 1rem; text-align: left; }
[dir="rtl"] .pf-alt { text-align: right; }
.pf-alt:lang(ar) { font-family: var(--f-kufi); }
.pf-top .res-cat { margin-top: .75rem; font-size: .92rem; }
.pf-meta { margin-top: .6rem; display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: .92rem; }
.pf-meta span { display: inline-flex; align-items: center; gap: .35rem; }
.pf-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.pf-actions .btn { padding: 0 .5rem; flex-direction: column; gap: .15rem; min-height: 64px; border-radius: var(--r-m); font-size: .82rem; }
.pf-actions .btn .i { width: 1.35em; height: 1.35em; }
.pf-sec h4 { font-size: .85rem; font-weight: 500; color: var(--ink-3); margin-bottom: .6rem; }
.pf-sec p { color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { font-size: .88rem; padding: .35rem .8rem; border-radius: 999px; background: var(--gypsum); }
.verify { display: grid; grid-template-columns: auto 1fr; gap: .2rem .75rem; align-items: center; padding: .9rem 1rem; border-radius: var(--r-m); border: 1px solid var(--line); }
.verify .i { width: 1.8em; height: 1.8em; grid-row: span 2; color: var(--ink-3); }
.verify.is-ok { border-color: color-mix(in srgb, var(--c-commercial) 50%, transparent); background: color-mix(in srgb, var(--c-commercial) 7%, transparent); }
.verify.is-ok .i { color: var(--c-commercial); }
.verify b { font-weight: 600; }
.verify small { color: var(--ink-3); font-size: .82rem; }
.pf-loc { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: center; }
.pf-loc svg { width: 100%; border-radius: var(--r-s); background: var(--dune-2); display: block; }
.pf-loc strong { font: 800 1.6rem/1.05 var(--f-display); display: block; }
:lang(ar) .pf-loc strong { font: 700 1.15rem/1.4 var(--f-body); }
.pf-loc p { font-size: .88rem; margin-top: .4rem; }
.linkbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: .5rem; font-size: .92rem; color: var(--ink-2); padding: .35rem 0; }
.linkbtn:hover { color: var(--asphalt); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:focus-visible { outline: 3px solid var(--signal); }
.linkbtn.strong { color: var(--petrol); font-weight: 500; }
.hours { width: 100%; border-collapse: collapse; font-size: .92rem; }
.hours td { padding: .4rem 0; border-bottom: 1px solid var(--line); }
.hours td:last-child { text-align: end; font-variant-numeric: tabular-nums; }
.hours tr.is-today td { font-weight: 600; }
.near-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.near-cards button { all: unset; cursor: pointer; display: grid; gap: .35rem; border-radius: var(--r-m); padding: .5rem; border: 1px solid var(--line); font-size: .85rem; line-height: 1.3; }
.near-cards button:hover, .near-cards button:focus-visible { border-color: var(--asphalt); }
.near-cards .res-thumb { width: 100%; height: 64px; }
.near-cards small { color: var(--ink-3); }
.pf-foot { border-top: 1px solid var(--line); padding-top: 1.25rem; display: grid; gap: .35rem; }

/* DIRECTIONS */
.dir { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 1rem; background: rgba(12, 18, 22, .55); animation: fadeIn .25s; }
@keyframes fadeIn { from { opacity: 0; } }
.dir-card { width: min(920px, 100%); max-height: calc(100svh - 2rem); overflow: auto; background: var(--paper); border-radius: var(--r-l); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); animation: dirIn .45s var(--ease); }
@keyframes dirIn { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.dir-fig { background: var(--dune-2); min-height: 360px; position: relative; }
.dir-fig svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dir-body { padding: clamp(1.25rem, 3vw, 2rem); display: flex; flex-direction: column; gap: 1rem; }
.dir-body > p:first-child { color: var(--ink-3); font-size: .9rem; }
.dir-body h3 { font: 800 clamp(1.9rem, 3.5vw, 2.6rem)/1 var(--f-display); }
:lang(ar) .dir-body h3 { font: 700 1.6rem/1.3 var(--f-kufi); }
.dir-unit { font-weight: 600; margin-top: -.5rem; }
.dir-steps { display: grid; gap: .6rem; counter-reset: s; }
.dir-steps li { display: grid; grid-template-columns: 26px 1fr; gap: .6rem; font-size: .95rem; opacity: 0; animation: stepShow .4s var(--ease) forwards; animation-delay: calc(.5s + var(--i) * .22s); }
@keyframes stepShow { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.dir-steps li span { width: 26px; height: 26px; border-radius: 50%; background: var(--gypsum); display: grid; place-items: center; font-size: .78rem; font-weight: 600; }
.dir-handoff { font-size: .84rem; color: var(--ink-3); }
.dir-act { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: auto; }
.iso-route { fill: none; stroke: var(--signal); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.iso-route-case { fill: none; stroke: var(--asphalt); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }

/* DISCOVER */
.discover { padding-block: clamp(4rem, 8vw, 6rem) 1rem; }
.disc-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem 2rem; }
.disc-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.disc-tabs button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: .5rem 1.05rem; font-weight: 500; }
.disc-tabs button[aria-selected="true"] { background: var(--asphalt); color: var(--gypsum); border-color: var(--asphalt); }
.rail { margin-top: 1.75rem; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 1rem; scrollbar-width: thin; }
.rail li { scroll-snap-align: start; }
.card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; width: 100%; background: var(--paper); border-radius: var(--r-l); overflow: hidden; border: 1px solid var(--line); transition: border-color .2s, transform .25s var(--ease); height: 100%; }
.card:hover { border-color: var(--asphalt); transform: translateY(-3px); }
.card:focus-visible { outline: 3px solid var(--signal); }
.card-img { aspect-ratio: 16 / 9; background: var(--dune-2); }
.card-img svg { width: 100%; height: 100%; display: block; }
.card-b { padding: .9rem 1rem 1.1rem; display: grid; gap: .25rem; }
.card-b b { font-size: 1.02rem; font-weight: 600; }
.card-b small { color: var(--ink-3); }
.card-big { font: 800 2rem/1 var(--f-display); }
.rail.is-swapping li { animation: resIn .4s var(--ease) both; animation-delay: calc(var(--i) * 50ms); }

/* WHY */
.why { padding-block: clamp(4rem, 10vw, 8rem); }
.why-grid { margin-top: clamp(2rem, 5vw, 3.5rem); display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(2rem, 5vw, 5rem); }
.why-fig { position: relative; }
.why-stage { position: sticky; top: calc(var(--bar-h) + 2rem); aspect-ratio: 1.25; border-radius: var(--r-l); background: var(--dune-2); overflow: hidden; }
.why-layer { position: absolute; inset: 0; display: grid; place-items: center; padding: 1.25rem; transition: opacity .6s var(--ease), transform .8s var(--ease); }
.why-layer svg { width: 100%; height: 100%; }
.why-regional { padding: 0; }
.why-site { opacity: 0; transform: scale(1.08); }
.why-stage:not([data-step="1"]) .why-regional { opacity: 0; transform: scale(.9); }
.why-stage:not([data-step="1"]) .why-site { opacity: 1; transform: none; }
.why-stage .why-site [data-z] { opacity: .35; transition: opacity .5s; }
.why-stage[data-step="2"] .why-site [data-z~="auto"],
.why-stage[data-step="3"] .why-site [data-z~="ind"],
.why-stage[data-step="4"] .why-site [data-z~="svc"],
.why-stage[data-step="5"] .why-site [data-z~="exp"],
.why-stage[data-step="5"] .why-site [data-space] { opacity: 1; }
.why-stage .why-site .p-tint { opacity: 0; }
.why-stage[data-step="2"] .why-site [data-z~="auto"] + .p-tint,
.why-stage[data-step="3"] .why-site [data-z~="ind"] + .p-tint,
.why-stage[data-step="4"] .why-site [data-z~="svc"] + .p-tint { opacity: .45; }
.why-stage[data-step="5"] .why-site [data-space] + .p-tint { opacity: .6; --c: var(--signal) !important; }
.rg-land { fill: var(--dune); }
.rg-sea { fill: color-mix(in srgb, var(--petrol) 22%, var(--dune-2)); }
.rg-road { stroke: var(--road); stroke-width: 7; fill: none; stroke-linecap: round; }
.rg-road-in { stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 6 8; fill: none; }
.rg-dot { fill: var(--asphalt); }
.rg-txt { font: 500 15px var(--f-body); fill: var(--asphalt); paint-order: stroke; stroke: var(--dune); stroke-width: 4px; }
.rg-sandan circle:first-child { fill: var(--signal); stroke: var(--asphalt); stroke-width: 2; }
.rg-sandan .rg-txt { font-weight: 700; font-size: 17px; }
.rg-pulse { fill: none; stroke: var(--signal); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: rgPulse 2.4s ease-out infinite; }
@keyframes rgPulse { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.rg-note { font: 400 12px var(--f-body); fill: var(--ink-3); }
.why-steps li { min-height: 52vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-block: 2rem; opacity: .32; transition: opacity .5s; }
.why-steps li:first-child { min-height: 40vh; justify-content: flex-start; padding-top: 1rem; }
.why-steps li:last-child { min-height: 44vh; }
.why-steps li.is-on { opacity: 1; }
.why-steps h3 { font: 800 clamp(1.8rem, 3vw, 2.4rem)/1 var(--f-display); }
:lang(ar) .why-steps h3 { font: 700 1.6rem/1.3 var(--f-kufi); }
.why-steps p { margin-top: .9rem; color: var(--ink-2); font-size: 1.08rem; max-width: 42ch; }
.why-steps .btn { margin-top: 1.25rem; }

/* BUILD */
.build { background: var(--petrol-2); color: var(--on-petrol); padding-block: clamp(4rem, 9vw, 7rem); }
.build .lede { color: color-mix(in srgb, var(--on-petrol) 78%, transparent); }
.bd-head h2 { max-width: 14ch; }
.bd-grid { margin-top: clamp(2rem, 4vw, 3rem); display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(1.25rem, 3vw, 2.5rem); align-items: start; }
.lead { background: var(--paper); color: var(--asphalt); border-radius: var(--r-l); padding: clamp(1.25rem, 3vw, 2.25rem); box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); }
.steps { display: flex; gap: .5rem; margin-bottom: 1.75rem; }
.steps li { flex: 1; display: flex; align-items: center; gap: .5rem; padding-bottom: .6rem; border-bottom: 3px solid var(--line); color: var(--ink-3); font-size: .9rem; transition: border-color .3s, color .3s; }
.steps li span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; border: 1.5px solid currentColor; flex: none; }
.steps li b { font-weight: 500; }
.steps li.is-on, .steps li.is-done { color: var(--asphalt); border-color: var(--petrol); }
.steps li.is-done span { background: var(--petrol); border-color: var(--petrol); color: var(--on-petrol); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.fstep { display: none; }
.fstep.is-on { display: grid; gap: 1.25rem; animation: stepIn .4s var(--ease); }
@keyframes stepIn { from { opacity: 0; transform: translateX(14px); } }
[dir="rtl"] .fstep.is-on { animation-name: stepInR; }
@keyframes stepInR { from { opacity: 0; transform: translateX(-14px); } }
.flabel, .field > span, .field > legend { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .5rem; color: var(--asphalt); }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: .5rem; }
.type { position: relative; }
.type input { position: absolute; opacity: 0; pointer-events: none; }
.type label { display: grid; justify-items: start; gap: .5rem; padding: .8rem; border: 1.5px solid var(--line); border-radius: var(--r-m); cursor: pointer; font-size: .92rem; font-weight: 500; transition: border-color .2s, background-color .2s, transform .2s var(--ease); min-height: 96px; }
.type label:hover { border-color: var(--asphalt); }
.type svg { width: 44px; height: 32px; color: var(--ink-2); }
.type input:checked + label { border-color: var(--petrol); background: color-mix(in srgb, var(--petrol) 9%, transparent); box-shadow: inset 0 0 0 1px var(--petrol); }
.type input:checked + label svg { color: var(--petrol); }
.type input:focus-visible + label { outline: 3px solid var(--signal); outline-offset: 2px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.field input, .field select, .field textarea, .tel { width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--paper); padding: .75rem .85rem; min-height: 48px; transition: border-color .2s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--petrol); box-shadow: 0 0 0 3px color-mix(in srgb, var(--petrol) 20%, transparent); }
.field textarea { resize: vertical; }
.tel { display: flex; align-items: center; padding: 0; overflow: hidden; }
.tel-cc { padding-inline: .85rem; color: var(--ink-3); border-inline-end: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
.tel input { border: 0; min-height: 45px; }
.tel input:focus { box-shadow: none; }
.tel:focus-within { border-color: var(--petrol); box-shadow: 0 0 0 3px color-mix(in srgb, var(--petrol) 20%, transparent); }
.is-invalid, .is-invalid.tel { border-color: #C23B2B !important; }
.err { color: #B3321F; font-size: .85rem; margin-top: -.75rem; }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; padding: .55rem 1rem; border: 1.5px solid var(--line); border-radius: 999px; font-size: .92rem; cursor: pointer; font-weight: 500; }
.seg span:hover { border-color: var(--asphalt); }
.seg input:checked + span { border-color: var(--petrol); background: var(--petrol); color: var(--on-petrol); }
.seg input:focus-visible + span { outline: 3px solid var(--signal); outline-offset: 2px; }
.fnav { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.75rem; }
.fine { margin-top: 1rem; font-size: .78rem; color: var(--ink-3); }
.match { background: color-mix(in srgb, var(--on-petrol) 7%, transparent); border: 1px solid rgba(255,255,255,.14); border-radius: var(--r-l); overflow: hidden; position: sticky; top: calc(var(--bar-h) + 1.5rem); }
.match-plan { background: var(--dune-2); padding: .75rem; }
.match-plan svg { width: 100%; display: block; }
.match-plan .p-block { cursor: default; }
.match-plan .p-block.is-match { stroke: var(--signal); stroke-width: 4; }
.match-plan .p-tint.is-match { opacity: .55; --c: var(--signal) !important; animation: matchPulse 1.6s ease-in-out infinite alternate; }
@keyframes matchPulse { from { opacity: .3; } to { opacity: .7; } }
.match-plan .p-block.is-pick { stroke: var(--petrol); stroke-width: 6; }
.match-body { padding: 1.25rem; }
.match-body h3 { font: 800 1.7rem/1 var(--f-display); }
:lang(ar) .match-body h3 { font: 700 1.3rem/1.4 var(--f-kufi); }
.match-sub { margin-top: .4rem; font-size: .92rem; color: color-mix(in srgb, var(--on-petrol) 78%, transparent); }
.match-list { margin-top: .8rem; display: grid; gap: .4rem; }
.match-list li { display: grid; grid-template-columns: 1fr auto; gap: .1rem 1rem; align-items: center; padding: .7rem .8rem; border-radius: var(--r-m); background: rgba(255,255,255,.06); }
.match-list li.is-pick { background: rgba(245, 179, 1, .16); box-shadow: inset 0 0 0 1.5px var(--signal); }
.match-list b { font-weight: 600; }
.match-list span { font-size: .84rem; color: color-mix(in srgb, var(--on-petrol) 72%, transparent); }
.match-list button { grid-row: span 2; border: 1.5px solid rgba(255,255,255,.4); background: none; color: var(--on-petrol); border-radius: 999px; padding: .4rem .95rem; font-size: .85rem; }
.match-list li.is-pick button, .match-list button:hover { background: var(--signal); color: #1D1F21; border-color: var(--signal); }
.done { padding: .5rem 0; }
.done:focus { outline: none; }
.done-top { display: flex; align-items: center; gap: 1rem; }
.done-mark { width: 52px; height: 52px; flex: none; }
.done-mark circle { fill: none; stroke: var(--c-commercial); stroke-width: 2.5; stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw .6s var(--ease) forwards; }
.done-mark path { fill: none; stroke: var(--c-commercial); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s .45s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done h3 { font: 800 2rem/1 var(--f-display); }
:lang(ar) .done h3 { font: 700 1.5rem/1.3 var(--f-kufi); }
.done > p { margin-top: .75rem; color: var(--ink-2); }
.inq { margin-top: 1.25rem; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; animation: inqIn .6s .5s var(--ease) both; }
@keyframes inqIn { from { opacity: 0; transform: translateY(12px); } }
.inq-h { background: var(--asphalt); color: var(--gypsum); padding: .75rem 1rem; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
.inq-h b { font-weight: 600; }
.inq-h small { font-size: .8rem; opacity: .75; }
.inq dl { display: grid; grid-template-columns: max-content 1fr; }
.inq dt, .inq dd { padding: .55rem 1rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
.inq dt { color: var(--ink-3); }
.inq dd { font-weight: 500; }
.done-actions { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem; }

/* FOOTER */
.foot { border-top: 1px solid var(--line); padding-block: 2rem calc(2rem + env(safe-area-inset-bottom, 0px)); color: var(--ink-2); font-size: .9rem; }
.foot-in { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; }
.foot-nav { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 1.25rem; }
.foot-nav a { text-decoration: none; }
.foot-nav a:hover { color: var(--asphalt); }

/* dialog / console / toast */
.dlg { border: 0; border-radius: var(--r-l); padding: 1.5rem; width: min(440px, calc(100% - 2rem)); background: var(--paper); color: var(--asphalt); }
.dlg::backdrop { background: rgba(15, 22, 28, .5); }
.rp-opts { display: grid; gap: .35rem; margin: 1rem 0; }
.rp-opts label { display: flex; align-items: center; gap: .6rem; padding: .55rem .75rem; border: 1px solid var(--line); border-radius: var(--r-s); cursor: pointer; }
.rp-opts label:has(input:checked) { border-color: var(--petrol); background: color-mix(in srgb, var(--petrol) 8%, transparent); }
.console { position: fixed; inset: 0; z-index: 75; background: var(--gypsum); overflow-y: auto; animation: consoleIn .4s var(--ease); padding-top: env(safe-area-inset-top, 0px); }
@keyframes consoleIn { from { opacity: 0; transform: translateY(24px); } }
.co-bar { position: sticky; top: 0; z-index: 2; background: var(--asphalt); color: var(--gypsum); display: flex; align-items: center; gap: 1rem; padding: .9rem var(--gut); }
.co-bar h2 { font-size: 1.6rem; }
:lang(ar) .co-bar h2 { font-size: 1.3rem; }
.co-bar p { font-size: .82rem; color: color-mix(in srgb, var(--gypsum) 70%, transparent); }
.co-bar .btn { margin-inline-start: auto; border-color: rgba(255,255,255,.3); color: var(--gypsum); background: transparent; }
.co-grid { padding-block: 1.5rem 3rem; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.co-kpi { background: var(--paper); border-radius: var(--r-m); padding: 1.1rem 1.25rem; }
.co-kpi span { font-size: .85rem; color: var(--ink-2); }
.co-kpi b { display: block; font: 800 2.6rem/1 var(--f-display); margin-top: .4rem; }
.co-kpi small { display: block; font-size: .78rem; color: var(--ink-3); margin-top: .3rem; }
.co-panel { background: var(--paper); border-radius: var(--r-m); padding: 1.25rem; grid-column: span 2; }
.co-panel.wide { grid-column: 1 / -1; }
.co-panel h3 { font-size: 1rem; display: flex; justify-content: space-between; gap: 1rem; }
.co-panel h3 small { font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.co-table { width: 100%; border-collapse: collapse; margin-top: .75rem; font-size: .88rem; }
.co-table th { text-align: start; font-weight: 500; color: var(--ink-3); padding: .5rem .5rem .5rem 0; border-bottom: 1px solid var(--line); }
.co-table td { padding: .6rem .5rem .6rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.co-list { margin-top: .75rem; display: grid; gap: .35rem; }
.co-list li { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem .6rem; background: var(--gypsum); border-radius: 6px; font-size: .9rem; }
.co-empty { margin-top: .75rem; color: var(--ink-3); font-size: .9rem; }
.co-new { background: color-mix(in srgb, var(--signal) 18%, transparent); }
.co-clear { all: unset; cursor: pointer; font-size: .85rem; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.toast { position: fixed; z-index: 90; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 150%); background: var(--asphalt); color: var(--gypsum); padding: .8rem 1.2rem; border-radius: var(--r-m); max-width: min(92vw, 460px); font-size: .92rem; transition: transform .35s var(--ease), visibility 0s .35s; pointer-events: none; visibility: hidden; }
.toast.is-on { transform: translate(-50%, 0); visibility: visible; transition: transform .35s var(--ease); }

/* RESPONSIVE */
@media (max-width: 1180px) {
  .co-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel { width: 360px; }
}
@media (max-width: 960px) {
  .nav { display: none; }
  .hero { grid-template-columns: 1fr; min-height: auto; padding-top: calc(var(--bar-h) + 1rem); }
  .hero-word { position: relative; top: 0; inset-inline-start: -.04em; font-size: 28vw; }
  :lang(ar) .hero-word { font-size: 27vw; line-height: 1.1; top: 0; }
  .hero-model { position: relative; inset: auto; width: 150%; margin-inline-start: -25%; margin-top: -16vw; margin-bottom: -6vw; }
  .hero-copy { grid-column: 1; padding-top: 0; }
  .here-head, .here-grid, .why-grid, .bd-grid { grid-template-columns: 1fr; }
  .here-head { gap: 0; }
  .here-head .lede { margin-top: 1rem; }
  .facts-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact, .fact:first-child { padding: 1.1rem .75rem 1rem 0; border-inline-end: 0; }
  .fact:nth-child(even) { padding-inline-start: .75rem; border-inline-start: 1px solid var(--line); }
  .fact:nth-child(n+3) { border-top: 1px solid var(--line); }
  .why-fig { position: sticky; top: calc(var(--bar-h) + .5rem); z-index: 1; }
  .why-stage { position: relative; top: 0; aspect-ratio: 1.6; box-shadow: 0 10px 30px -20px rgba(0,0,0,.5); }
  .why-steps li, .why-steps li:first-child { min-height: 46vh; justify-content: center; }
  .match { position: relative; top: 0; order: -1; }

  /* map: full-height stage with draggable bottom sheet */
  .ex-head { margin-bottom: 1.25rem; }
  .stage { height: calc(100svh - var(--bar-h)); min-height: 560px; }
  .map { touch-action: pan-y; }
  .panel { top: auto; bottom: 0; inset-inline: 0; width: auto; border-radius: 20px 20px 0 0; height: var(--sheet-h, 232px); transition: height .38s var(--ease); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel.is-dragging { transition: none; }
  .grab { display: grid; place-items: center; height: 22px; flex: none; touch-action: none; cursor: grab; }
  .grab span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
  .panel-head { padding-top: .25rem; touch-action: none; }
  .panel-head .cats, .panel-head .subs { touch-action: pan-x; }
  .panel-head input { touch-action: manipulation; }
  .legend { display: none; }
  .mctl { top: .75rem; inset-inline-end: .75rem; }
  .pop { left: .5rem !important; right: .5rem !important; top: auto !important; bottom: calc(var(--sheet-h, 232px) + .5rem); width: auto; }
  .hint { top: auto; bottom: calc(var(--sheet-h, 232px) + 1rem); }
  .profile { width: 100%; transform: translateY(100%) !important; transition-duration: .5s; }
  [dir="rtl"] .profile { transform: translateY(100%) !important; }
  .profile.is-on { transform: none !important; }
  .dir { padding: 0; place-items: end stretch; }
  .dir-card { grid-template-columns: 1fr; border-radius: 22px 22px 0 0; max-height: 94svh; }
  .dir-fig { min-height: 240px; }
}
@media (max-width: 640px) {
  :root { --bar-h: 58px; }
  .bar { gap: .75rem; }
  .brand-ar, .bar-find { display: none; }
  .frow { grid-template-columns: 1fr; }
  .district { grid-template-columns: 4px 1fr; }
  .district button { grid-column: 2; justify-self: start; padding-top: 0; }
  .pf-loc { grid-template-columns: 1fr; }
  .near-cards { grid-template-columns: 1fr 1fr; }
  .pf-actions { grid-template-columns: 1fr 1fr; }
  .pf-actions .btn { flex-direction: row; min-height: 50px; font-size: .9rem; gap: .4rem; }
  .co-grid { grid-template-columns: 1fr 1fr; }
  .co-panel { grid-column: 1 / -1; }
  .hero-search .btn { padding: 0 1rem; }
  .rail { grid-auto-columns: 78%; }
  .foot-nav { margin-inline-start: 0; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; animation-delay: 0s !important; }
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
.map:not([data-tab="near"]) #mRadius, .map:not([data-tab="near"]) #mYou { display: none; }
.map:not([data-tab="visit"]) #mRoute, .map:not([data-tab="visit"]) #mStops { display: none; }
.stop-n, .m-lbl-g { pointer-events: none; }
.m-lbl-g .p-amen { pointer-events: none; }

</style>
</head>
<body>
<a class="skip" href="#explore" data-i18n="skip">Skip to the map</a>

<header class="bar" id="bar">
  <a class="brand" href="#top" aria-label="Sandan">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--petrol)"/><path d="M8 22 16 9l8 13z" fill="var(--signal)"/></svg>
    <span class="brand-en">Sandan</span><span class="brand-ar">سندان</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#explore" data-i18n="nav.explore">Explore</a>
    <a href="#discover" data-i18n="nav.discover">Discover</a>
    <a href="#why" data-i18n="nav.why">Why Sandan</a>
    <a href="#build" data-i18n="nav.build">Build here</a>
  </nav>
  <div class="bar-end">
    <button class="lang" id="langBtn" type="button" lang="ar" data-i18n="lang.switch">العربية</button>
    <a class="btn btn-signal btn-sm bar-find" href="#explore" data-focus-search data-i18n="nav.find">Find a business</a>
  </div>
</header>

<main id="top">

  <!-- WOW -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero-word" aria-hidden="true" data-i18n="hero.word">SANDAN</div>
    <figure class="hero-model" id="heroModel" role="img" data-i18n-aria="hero.model" aria-label=""></figure>
    <div class="hero-copy">
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <h1 id="heroTitle" data-i18n="hero.title"></h1>
      <p class="hero-lede" data-i18n="hero.lede"></p>
      <label class="ask" for="heroQ" data-i18n="hero.ask"></label>
      <form class="hero-search sgx" id="heroSearch" role="search">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="heroQ" autocomplete="off" data-i18n-ph="hero.search" role="combobox" aria-expanded="false" aria-controls="heroSg" aria-autocomplete="list">
        <button class="btn btn-petrol" type="submit" data-i18n="hero.go"></button>
        <div class="sg" id="heroSg" role="listbox" hidden></div>
      </form>
      <div class="hero-cta">
        <a class="btn btn-signal" href="#explore"><span data-i18n="hero.explore"></span><svg class="i" aria-hidden="true"><use href="#i-down"/></svg></a>
        <a class="textlink" href="#build" data-i18n="hero.build"></a>
      </div>
    </div>
  </section>

  <!-- UNDERSTAND -->
  <section class="here wrap" id="here" aria-labelledby="hereTitle">
    <div class="here-head">
      <h2 id="hereTitle" data-i18n="here.title"></h2>
      <p class="lede" data-i18n="here.lede"></p>
    </div>
    <div class="here-grid">
      <figure class="here-plan" id="herePlan" aria-hidden="true"></figure>
      <ul class="districts" id="districts"></ul>
    </div>
    <div class="facts">
      <h3 class="facts-title" data-i18n="facts.title"></h3>
      <dl class="facts-list" id="facts"></dl>
    </div>
  </section>

  <!-- EXPLORE: the map is the star -->
  <section class="explore" id="explore" aria-labelledby="exTitle">
    <div class="wrap ex-head">
      <h2 id="exTitle" data-i18n="ex.title"></h2>
      <p class="lede" data-i18n="ex.lede"></p>
    </div>
    <div class="stage" id="stage">
      <svg id="map" class="map is-iso" tabindex="0" role="application" data-i18n-aria="map.label"></svg>
      <div class="tip" id="tip" hidden></div>

      <div class="mctl">
        <div class="mode" role="group" aria-label="View">
          <button type="button" data-mode="iso" aria-pressed="true" data-i18n="map.3d">3D</button>
          <button type="button" data-mode="plan" aria-pressed="false" data-i18n="map.plan">Plan</button>
        </div>

<script>
/* =====================================================================
   SANDAN DIGITAL GATEWAY — application (v2)
   Vanilla JS, no build step. Reads window.SANDAN_DATA + SANDAN_I18N.
   ===================================================================== */
(() => {
  "use strict";

  const D = window.SANDAN_DATA;
  const T = window.SANDAN_I18N;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isNarrow = () => matchMedia("(max-width: 960px)").matches;
  const smooth = () => (reduced ? "auto" : "smooth");

  /* ---------- storage (stays in this browser) ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sandan:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("sandan:" + k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
    push(k, v, cap = 300) { const a = store.get(k, []); a.push(v); store.set(k, a.slice(-cap)); },
    del(k) { try { localStorage.removeItem("sandan:" + k); } catch (e) { /* ignore */ } }
  };
  const hist = {
    push(state, url) { try { history.pushState(state, "", url); } catch (e) { /* embedded */ } },
    replace(state, url) { try { history.replaceState(state, "", url); } catch (e) { /* embedded */ } },
    back() { try { history.back(); } catch (e) { /* embedded */ } }
  };

  /* ---------- lookups ---------- */
  const catById = Object.fromEntries(D.categories.map((c) => [c.id, c]));
  const subById = {};
  D.categories.forEach((c) => c.subs.forEach((s) => (subById[s.id] = Object.assign({ cat: c.id }, s))));
  const blockById = Object.fromEntries(D.plan.blocks.map((b) => [b.id, b]));
  const zoneById = Object.fromEntries(D.plan.zones.map((z) => [z.id, z]));
  const bizById = Object.fromEntries(D.businesses.map((b) => [b.id, b]));
  const spaceById = Object.fromEntries(D.spaces.map((s) => [s.id, s]));
  const bizByBlock = {};
  D.businesses.forEach((b) => (bizByBlock[b.block] = bizByBlock[b.block] || []).push(b));
  const spacesByBlock = {};
  D.spaces.forEach((s) => (spacesByBlock[s.block] = spacesByBlock[s.block] || []).push(s));
  const MPU = D.plan.metersPerUnit || 0.55;

  /* ---------- state ---------- */
  const S = {
    lang: store.get("lang", (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en"),
    q: "", cat: "all", sub: null, sel: null, selBlock: null, tab: "results",
    results: [], base: [], partial: false, matchedSubs: [],
    near: { pos: null, r: 250, placing: false },
    visit: { needs: new Set(), plan: null }
  };
  const t = (key, vars) => {
    let s = (T[S.lang] && T[S.lang][key]) ?? T.en[key] ?? key;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  };
  const L = (o) => (o ? o[S.lang] ?? o.en : "");
  const cvar = (cat) => `var(--c-${cat})`;
  const ICON = { automotive: "car", industrial: "gear", commercial: "bag", services: "briefcase", living: "home" };
  const icon = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const nf = (n) => Number(n).toLocaleString("en-US");
  const SEP = () => (S.lang === "ar" ? "، " : ", ");

  let toastT;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.classList.add("is-on");
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("is-on"), 3400);
  }

  /* =====================================================================
     GEOMETRY (plan units)
     ===================================================================== */
  function unitGrid(blk) { const rows = blk.units >= 4 ? 2 : 1; return { rows, cols: Math.ceil(blk.units / rows) }; }

  function initSheet() {

    g.addEventListener("pointermove", (e) => {
      if (!st) return;

      const h = Math.min(Math.max(st.h - dy, sheetPx("peek")), sheetPx("full"));

    });
    const up = (e) => {
      if (!st) return;
      sheet.el.classList.remove("is-dragging");
      if (!st.moved) sheetSnap(sheet.snap === "peek" ? "half" : sheet.snap === "half" ? "full" : "peek");
      else {
        const h = sheetH(), snaps = ["peek", "half", "full"];
        const dy = e.clientY - st.y;
        let best = snaps.reduce((a, s) => (Math.abs(sheetPx(s) - h) < Math.abs(sheetPx(a) - h) ? s : a), "peek");
        if (Math.abs(dy) > 60) { const i = snaps.indexOf(sheet.snap); best = dy < 0 ? snaps[Math.min(2, i + 1)] : snaps[Math.max(0, i - 1)]; }

  }

  function planVisit() {
    const needs = D.visitNeeds.filter((n) => S.visit.needs.has(n.id));
    if (!needs.length) { toast(t("visit.pick")); return; }
    let cur = GATE, left = needs.slice();
    const stops = [], used = new Set();
    while (left.length) {
      let best = null;
      left.forEach((n) => D.businesses.forEach((b) => {
        if (used.has(b.id) || !b.subs.some((s) => n.subs.includes(s))) return;
        const a = access(b), d = polyLen(routePts(cur, a));
        if (!best || d < best.d) best = { n, b, a, d };
      }));
      if (!best) break;
      stops.push(best); used.add(best.b.id); cur = best.a;
      left = left.filter((n) => n !== best.n);
    }
    let poly = [], prev = GATE;
    stops.forEach((s) => { const seg = routePts(prev, s.a); poly = poly.concat(poly.length ? seg.slice(1) : seg); prev = s.a; });
    S.visit.plan = { stops, missing: left, poly, len: polyLen(poly) };
    drawVisit(true);
    renderVisit();
    if (isNarrow()) sheetSnap("half");
  }

  function attachSuggest(input, box, onGo) {

    const row = (i, ic, text, meta, c) => `<button type="button" class="sg-row" role="option" data-i="${i}"${c ? ` style="--c:${c}"` : ""}>${ic}<span>${text}</span>${meta ? `<small>${esc(meta)}</small>` : ""}</button>`;

      const q = input.value.trim(); items = []; let h = "";

        h = `<h4>${esc(t("sg.popular"))}</h4><div class="sg-chips">` + D.popular.map((p) => { const i = items.length; items.push({ type: "q", q: L(p) }); return `<button type="button" class="sg-chip" role="option" data-i="${i}">${esc(L(p))}</button>`; }).join("") + `</div>`;
      } else {
        const r = search(q);
        const subs = r.subs.slice(0, 3);
        if (subs.length) { h += `<h4>${esc(t("sg.cats"))}</h4>`; subs.forEach((id) => { const s = subById[id], i = items.length; items.push({ type: "sub", id }); h += row(i, icon(ICON[s.cat]), esc(L(s.name)), L(catById[s.cat].name), cvar(s.cat)); }); }
        const biz = r.list.slice(0, 5);
        if (biz.length) { h += `<h4>${esc(t("sg.places"))}</h4>`; biz.forEach((b) => { const i = items.length; items.push({ type: "biz", id: b.id }); h += row(i, `<span class="dot"></span>`, highlightFor(L(b.name), q), t("ex.block", { b: b.block, u: b.unit }), cvar(b.category)); }); }
        const i = items.length; items.push({ type: "q", q }); h += row(i, icon("search"), esc(t("sg.all", { q })), "");
      }
      box.innerHTML = h; act = -1; mark();
    }
    const open = () => { render(); box.hidden = false; input.setAttribute("aria-expanded", "true"); };
    const close = () => { box.hidden = true; input.setAttribute("aria-expanded", "false"); act = -1; };
    input.addEventListener("focus", open);
    input.addEventListener("input", () => { if (document.activeElement === input) open(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); if (box.hidden) open(); act = Math.min(items.length - 1, act + 1); mark(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(-1, act - 1); mark(); }
      else if (e.key === "Enter") { e.preventDefault(); const it = act >= 0 ? items[act] : { type: "q", q: input.value.trim() }; close(); onGo(it); }
      else if (e.key === "Escape" && !box.hidden) { e.preventDefault(); close(); }
    });
    box.addEventListener("mousedown", (e) => e.preventDefault());
    box.addEventListener("click", (e) => { const el = e.target.closest("[data-i]"); if (!el) return; const it = items[+el.dataset.i]; close(); input.blur(); onGo(it); });
    input.addEventListener("blur", () => setTimeout(close, 150));
    return { close };
  }

  function directionSteps(b) {
    const a = access(b), steps = [t("dir.gate")];
    if (a.sy - GATE.y > 20) steps.push(t("dir.blvd", { m: meters(a.sy - GATE.y) }));
    const east = a.door.x > BX;
    steps.push(t(east ? "dir.left" : "dir.right", { s: L(a.street.name) }));
    steps.push(t("dir.go", { m: meters(Math.abs(a.door.x - BX)) }));

    return steps;
  }
  function dirScene(b) {
    const a = access(b), route = routePts(GATE, a).map((p) => pr(p.x, p.y, 0));
    const len = route.reduce((s, p, i) => (i ? s + Math.hypot(p[0] - route[i - 1][0], p[1] - route[i - 1][1]) : 0), 0);
    const d = "M" + route.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
    const H = blockH(a.blk), pinAt = pr(a.x, a.y, H), gate = pr(GATE.x, GATE.y, 0);
    const under = `<path class="iso-route-case" d="${d}"/><path class="iso-route" d="${d}" style="stroke-dasharray:${len.toFixed(0)};stroke-dashoffset:${reduced ? 0 : len.toFixed(0)};${reduced ? "" : "animation:drawIn 1.6s .35s var(--ease) forwards"}"/>`;
    const all = route.concat([pinAt, [pinAt[0], pinAt[1] - 60], gate]);
    let x0 = Math.min(...all.map((p) => p[0])) - 110, x1 = Math.max(...all.map((p) => p[0])) + 110;
    let y0 = Math.min(...all.map((p) => p[1])) - 60, y1 = Math.max(...all.map((p) => p[1])) + 70;
    let w = x1 - x0, h = y1 - y0;
    if (w < 560) { x0 -= (560 - w) / 2; w = 560; }
    if (w / h < 1.2) { const nw = h * 1.2; x0 -= (nw - w) / 2; w = nw; } else { const nh = w / 1.2; y0 -= (nh - h) / 2; h = nh; }
    const k = 1.8;
    return `<svg viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      ${isoCity({ under, highlight: b.block })}
      <g transform="translate(${gate[0]} ${gate[1]})"><circle r="13" fill="var(--paper)" stroke="var(--asphalt)" stroke-width="2"/><path d="${AMEN_ICON.gate}" fill="var(--asphalt)" transform="scale(1.3)"/></g>
      <g transform="translate(${pinAt[0]} ${pinAt[1]})" style="--c:${cvar(b.category)}"><path class="mk-pin" transform="scale(${k})" d="${PIN}" style="stroke:var(--signal);stroke-width:1.5"/><circle class="mk-core" cy="${-19 * k}" r="${4 * k}"/></g></svg>`;
