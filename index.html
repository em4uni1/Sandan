     LEASING INBOX (management preview)
     ===================================================================== */
  const co = { el: $("#console"), last: null };
  function renderConsole() {
    const leads = store.get("leads", []), searches = store.get("searches", []), reports = store.get("reports", []), lastRef = store.get("lastLead", null);
    const miss = searches.filter((s) => s.n === 0);
    const agg = (arr) => { const m = new Map(); arr.forEach((s) => { const k = norm(s.q); if (!k) return; const v = m.get(k) || { q: s.q, n: 0 }; v.n++; m.set(k, v); }); return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 8); };
    const dt = (ms) => new Date(ms).toLocaleString(S.lang === "ar" ? "ar-OM" : "en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const list = (arr, empty) => arr.length ? `<ul class="co-list">${arr.map((x) => `<li><span>${esc(x.q)}</span><b>${x.n}</b></li>`).join("")}</ul>` : `<p class="co-empty">${esc(empty)}</p>`;
    const verified = D.businesses.filter((b) => b.verified).length;
    co.el.innerHTML = `
      <div class="co-bar"><div><h2 id="coTitle">${esc(t("co.title"))}</h2><p>${esc(t("co.preview"))}</p></div>
        <button type="button" class="btn btn-sm" data-co="close">${icon("x")}<span>${esc(t("co.close"))}</span></button></div>
      <div class="wrap co-grid">
        <div class="co-kpi"><span>${esc(t("co.leads"))}</span><b>${leads.length}</b></div>
        <div class="co-kpi"><span>${esc(t("co.searches"))}</span><b>${searches.length}</b></div>
        <div class="co-kpi"><span>${esc(t("co.missing"))}</span><b>${miss.length}</b><small>${esc(t("co.missingNote"))}</small></div>
        <div class="co-kpi"><span>${esc(t("co.listings"))}</span><b>${D.businesses.length}</b><small>${esc(t("co.verified", { v: verified, n: D.businesses.length }))}</small></div>
        <div class="co-panel wide"><h3>${esc(t("co.leads"))}</h3>
          ${leads.length ? `<div style="overflow-x:auto"><table class="co-table"><thead><tr><th>Ref</th><th>${esc(t("f.company"))}</th><th>${esc(t("f.activity"))}</th><th>${esc(t("f.space"))}</th><th>${esc(t("f.area"))}</th><th>${esc(t("f.zone"))}</th><th>${esc(t("f.contact"))}</th><th></th></tr></thead><tbody>
          ${leads.slice().reverse().map((l) => `<tr class="${l.ref === lastRef ? "co-new" : ""}"><td dir="ltr">${esc(l.ref)}</td><td>${esc(l.company)}</td><td>${esc(l.activity)}</td><td>${esc(l.type === "other" ? t("bd.other") : spaceType(l.type))}${l.unit ? `<br><small>${esc(l.unit)}</small>` : ""}</td><td>${esc(areaName(l.area))}</td><td>${esc(zoneName(l.zone))}</td><td>${esc(l.name)}<br><small dir="ltr">+968 ${esc(l.phone)}</small></td><td><small>${esc(dt(l.t))}</small></td></tr>`).join("")}
          </tbody></table></div>` : `<p class="co-empty">${esc(t("co.noneLeads"))}</p>`}</div>
        <div class="co-panel"><h3>${esc(t("co.top"))}</h3>${list(agg(searches), t("co.none"))}</div>
        <div class="co-panel"><h3>${esc(t("co.missing"))} <small>${esc(t("co.missingNote"))}</small></h3>${list(agg(miss), t("co.none"))}</div>
        <div class="co-panel wide"><h3>${esc(t("co.reports"))} <small>${reports.length}</small></h3>
          ${reports.length ? `<table class="co-table"><tbody>${reports.slice().reverse().map((r) => `<tr><td>${esc(L(bizById[r.id]?.name))}</td><td>${esc(t("rp." + r.reason))}</td><td>${esc(r.note || "")}</td><td><small>${esc(dt(r.t))}</small></td></tr>`).join("")}</tbody></table>` : `<p class="co-empty">${esc(t("co.none"))}</p>`}</div>
        <p><button type="button" class="co-clear" data-co="clear">${esc(t("co.clear"))}</button></p>
      </div>`;
  }
  function openConsole() { co.last = document.activeElement; renderConsole(); co.el.hidden = false; document.documentElement.style.overflow = "hidden"; co.el.focus(); }
  function closeConsole() { co.el.hidden = true; if (!pf.open) document.documentElement.style.overflow = ""; co.last?.focus?.({ preventScroll: true }); }
  function initConsole() {
    document.addEventListener("click", (e) => { if (e.target.closest("[data-open-console]")) openConsole(); });
    co.el.addEventListener("click", (e) => {
      const a = e.target.closest("[data-co]")?.dataset.co;
      if (a === "close") closeConsole();
      if (a === "clear") { ["leads", "searches", "reports", "lastLead"].forEach(store.del); renderConsole(); }
    });
    co.el.addEventListener("keydown", (e) => { if (e.key === "Escape") closeConsole(); if (e.key === "Tab") trapTab(e, co.el); });
  }

  /* =====================================================================
     LANGUAGE
     ===================================================================== */
  function applyStatic() {
    const html = document.documentElement;
    html.lang = S.lang; html.dir = S.lang === "ar" ? "rtl" : "ltr";
    $$("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $$("[data-i18n-ph]").forEach((el) => el.setAttribute("placeholder", t(el.dataset.i18nPh)));
    $$("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    $("#langBtn").lang = S.lang === "ar" ? "en" : "ar";
    document.title = S.lang === "ar" ? "سندان — كل ما تحتاجه، في وجهة واحدة" : "Sandan — Everything you need. One destination.";
  }
  function setLang(lang) {
    S.lang = lang; store.set("lang", lang);
    applyStatic();
    renderHere(); factsCounted = true;
    renderCats(); renderSubs(false); runSearch({ animate: false, log: null });
    renderMap(); renderLegend();
    if (S.tab === "near") renderNear();
    if (S.tab === "visit") renderVisit();
    if (S.sel && !map.pop.hidden) showPopBiz(bizById[S.sel]);
    if (S.selBlock && !map.pop.hidden) showPopBlock(blockById[S.selBlock]);
    renderDiscover(false); renderWhy();
    renderBuild(); showStep(lead.step);
    if (lead.last && !$("#leadDone").hidden) renderDone(lead.last);
    if (pf.open) { const y = pf.el.scrollTop; pf.el.innerHTML = renderProfile(bizById[pf.open]); pf.el.scrollTop = y; }
    if (!dir.el.hidden && dir.id) openDirections(dir.id);
    if (!co.el.hidden) renderConsole();
    requestAnimationFrame(() => { map.resize(); applyVB(); });
  }

  /* =====================================================================
     SHELL
     ===================================================================== */
  function initShell() {
    const bar = $("#bar");
    addEventListener("scroll", () => bar.classList.toggle("is-scrolled", scrollY > 10), { passive: true });
    const links = $$(".nav a");
    const io = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (en.isIntersecting) links.forEach((a) => a.classList.toggle("is-here", a.getAttribute("href") === "#" + en.target.id));
    }), { rootMargin: "-40% 0px -55% 0px" });
    ["explore", "discover", "why", "build", "here"].forEach((id) => io.observe(document.getElementById(id)));
    new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) countUp(); }), { threshold: 0.4 }).observe($("#facts"));

    $("#langBtn").addEventListener("click", () => {
      const next = S.lang === "ar" ? "en" : "ar";
      if (document.startViewTransition && !reduced) document.startViewTransition(() => setLang(next)); else setLang(next);
    });
    const heroSg = attachSuggest($("#heroQ"), $("#heroSg"), (it) => goItem(it, true));
    $("#heroSearch").addEventListener("submit", (e) => { e.preventDefault(); heroSg.close(); goItem({ type: "q", q: $("#heroQ").value.trim() }, true); });
    attachSuggest(ex.q, $("#exSg"), (it) => goItem(it, false));
    $$("[data-focus-search]").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      $("#stage").scrollIntoView({ behavior: smooth(), block: "start" });
      setTimeout(() => ex.q.focus({ preventScroll: true }), reduced ? 0 : 600);
    }));
    document.addEventListener("click", (e) => { const g = e.target.closest("[data-goto-cat]"); if (g) gotoCategory(g.dataset.gotoCat); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !pf.open && co.el.hidden && dir.el.hidden) {
        e.preventDefault(); $("#explore").scrollIntoView({ behavior: smooth() }); ex.q.focus({ preventScroll: true });
      }
    });
    const route = () => {
      const m = location.hash.match(/^#\/b\/([\w-]+)/);
      if (m && bizById[m[1]]) openProfile(m[1], { push: false });
      else if (pf.open) closeProfile({ fromHistory: true });
    };
    addEventListener("popstate", route);
    addEventListener("hashchange", route);
    route();
  }

  /* =====================================================================
     BOOT
     ===================================================================== */
  applyStatic();
  buildHero();
  heroParallax();
  renderHere();
  initExplore();
  initMap();
  renderSubs();
  runSearch({ animate: false, log: null });
  setTab("results");
  initSheet();
  initProfile();
  initDirections();
  initReport();
  renderDiscover(false);
  initDiscover();
  renderWhy();
  initWhy();
  renderBuild();
  initBuild();
  initConsole();
  initShell();
  if (map.mode === "iso") rise();
})();

</script>
</body>
</html>
